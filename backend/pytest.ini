[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: 纯单元测试，无外部依赖
    integration: 需要真实 MySQL 实例（见 research.md R2，MUST NOT 用 SQLite 替代）
    contract: 接口契约测试，需要真实 MySQL 实例
    scale: 大体量用例（10 万行级），耗时较长，可用 -m "not scale" 排除
addopts = -q
