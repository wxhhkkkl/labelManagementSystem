# T153：工位软件打包配置（FR-074）
#
# Windows 10 的 x86 / x64 合一安装包，本地打印服务随软件启动。
appId: com.labelmgmt.print-client
productName: 打印管理系统工位软件
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# 32/64 位都要出包：工厂里的工位电脑不少还是 32 位系统
win:
  artifactName: LMS-Print-Setup-${version}.exe
  icon: resources/app.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  # 工位软件不签名，但保留配置位置便于后续接入企业证书
  signAndEditExecutable: true

nsis:
  installerIcon: resources/app.ico
  uninstallerIcon: resources/app.ico
  installerHeaderIcon: resources/app.ico
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 打印管理系统工位软件
  # 装完直接启动——操作员不必再自己去找图标
  runAfterFinish: true
  # 保留工位机器标识，避免重装后丢失已有绑定。
  deleteAppDataOnUninstall: false

publish: null

extraMetadata:
  main: out/main/index.js

extraResources:
  - from: resources/app.ico
    to: app.ico
