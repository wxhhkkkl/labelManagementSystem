# ---------------------------------------------------------------------------
# 打印管理系统 · nginx 同域反代配置
#
# 拓扑：管理后台静态文件与 API 都由 https://meichao.yuwangchenfa.com 提供（同源）。
# 因为同源，浏览器不触发 CORS，服务端也**不需要** CORS 中间件——攻击面更小。
#
# 工位软件（Electron）同样走这个域名的 /api，不直连数据库（宪章原则六 / FR-076）。
# ---------------------------------------------------------------------------

upstream lms_backend {
    # uvicorn 监听在本机回环地址，不对外暴露
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name meichao.yuwangchenfa.com;
    # 非功能需求要求全链路 HTTPS：80 只做跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name meichao.yuwangchenfa.com;

    ssl_certificate     /etc/nginx/ssl/meichao.yuwangchenfa.com.pem;
    ssl_certificate_key /etc/nginx/ssl/meichao.yuwangchenfa.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 导入接口要接收 10 万行级 Excel（FR-016），默认 1m 会直接 413
    client_max_body_size 64m;

    # 安全响应头。管理后台是内部系统，禁止被第三方站点内嵌。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/lms.access.log;
    error_log  /var/log/nginx/lms.error.log;

    # ---- 管理后台静态文件 ----
    root /var/www/lms-admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Vue Router history 模式
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不缓存，否则前端发版后用户拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- 后台 API ----
    location /api/ {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 导入是异步任务（research.md R3），上传接口本身应当很快；
        # 这里给足 120s 是为了应对网络慢的工位端提交大文件。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 工位端心跳与任务轮询频率高（5 秒一次），单独关掉访问日志避免刷爆磁盘
    location = /api/v1/workstation/heartbeat {
        access_log off;
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查不对外暴露细节
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://lms_backend;
    }
}

# ---------------------------------------------------------------------------
# 部署后自检：
#   curl -sS https://meichao.yuwangchenfa.com/health          # 期望 {"status":"ok"}
#   curl -sS -o /dev/null -w '%{http_code}\n' \
#     https://meichao.yuwangchenfa.com/api/v1/auth/me         # 期望 401（未带令牌）
#   第二条返回 401 才说明反代通了——返回 404 说明 location /api/ 没生效。
# ---------------------------------------------------------------------------
